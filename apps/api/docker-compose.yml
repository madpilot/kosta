services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5

  sprout:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: sprout-api:latest
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - '3000:3000'
    # Sprout reads its application config (AI backend, location, hemisphere,
    # weather key, logging, etc.) from the SQLite database, not from
    # environment variables. Configure those via /api/onboarding on first run
    # and PUT /api/settings afterwards.
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=/data/garden.db
    volumes:
      - sprout-data:/data

volumes:
  ollama-models:
  sprout-data:
