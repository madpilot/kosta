services:
  sprout:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: sprout-api:latest
    ports:
      - '3000:3000'
    # Sprout reads its application config (AI backend, location, hemisphere,
    # weather key, logging, etc.) from the SQLite database, not from
    # environment variables. Configure those via POST /api/onboarding on first
    # run and PUT /api/settings afterwards.
    #
    # To use a local OpenAI-compatible AI server (e.g. Ollama, llama.cpp,
    # LM Studio), set aiBackend to 'local' and localAiBaseUrl to your server's
    # /v1 endpoint (e.g. "http://host.docker.internal:11434/v1") via
    # POST /api/onboarding or PUT /api/settings.
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=/data/garden.db
    volumes:
      - sprout-data:/data

volumes:
  sprout-data:
